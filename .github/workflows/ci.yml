name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Repeat native handoff with retained exit observations
        shell: pwsh
        run: |
          go test -race ./internal/projectprocess -run '^TestSessionSurvivesRepeatedSupervisorDetachAndNativeAdoption$' -count=100 -timeout=10m -v 2>&1 | Tee-Object "$env:RUNNER_TEMP\restart-diagnostic.log"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-diagnostic
          path: ${{ runner.temp }}/restart-diagnostic.log
          if-no-files-found: error
