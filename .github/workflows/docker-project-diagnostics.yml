# Generated by scripts/packageui/render_docker_workflow.py; DO NOT EDIT.
name: Docker project diagnostics

on:
  workflow_dispatch:
  # Register feature-branch dispatches without running Docker during pull requests.
  pull_request:
    paths:
      - .github/workflows/docker-project-diagnostics.yml
      - scripts/packageui/render_docker_workflow.py

permissions:
  contents: read

concurrency:
  group: docker-project-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-adapter:
    name: Docker adapter and generated projects (Linux)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
      # Harbor refuses remote Engine endpoints because checkout labels are local authority. Keep this proof on the
      # hosted runner's Unix socket even when the runner image exports a Docker-in-Docker TCP override.
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: default
      HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY: ${{ github.workspace }}/harbor-docker-product-evidence
      HARBOR_DOCKER_PRODUCT_COMMIT: ${{ github.sha }}
      HARBOR_DOCKER_PRODUCT_ENGINE_KIND: docker-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out pinned GoForj source
        uses: actions/checkout@v7
        with:
          repository: goforj/goforj
          ref: v0.34.1
          path: .ci/goforj
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .ci/goforj/go.sum

      - name: Capture Docker product runner identity
        run: |
          test -n "${RUNNER_NAME:-}"
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          printf 'HARBOR_DOCKER_PRODUCT_RUNNER_NAME=%s\n' "$RUNNER_NAME" >> "$GITHUB_ENV"
          printf 'HARBOR_DOCKER_PRODUCT_RUNNER_IMAGE=%s\n' "$ImageOS" >> "$GITHUB_ENV"
          printf 'HARBOR_DOCKER_PRODUCT_RUNNER_IMAGE_VERSION=%s\n' "$ImageVersion" >> "$GITHUB_ENV"

      - name: Build pinned GoForj tools
        run: |
          binary_directory="${RUNNER_TEMP}/harbor-bin"
          binary="${binary_directory}/forj"
          mkdir -p "$binary_directory"
          (
            cd .ci/goforj
            go build -trimpath -o "$binary" ./cmd/forj
          )
          GOBIN="$binary_directory" go install github.com/goforj/wire/cmd/wire@v1.2.0
          printf 'HARBOR_PROJECT_IDENTITY_FORJ_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
          printf '%s\n' "$binary_directory" >> "$GITHUB_PATH"

      - name: Provision generated-project proof identities
        run: |
          ownership_file="${RUNNER_TEMP}/harbor-generated-project-identities"
          interface="lo"
          interface_index="$(cat "/sys/class/net/${interface}/ifindex")"
          : > "$ownership_file"
          for address in 127.77.254.10 127.77.254.11 127.77.254.12; do
            if ip -o -4 address show | awk '{print $4}' | grep -Fxq "$address/32"; then
              echo "generated-project identity already exists: $address" >&2
              exit 1
            fi
            sudo ip address add "$address/32" dev "$interface"
            printf '%s\t%s\t%s\n' "$interface" "$interface_index" "$address" >> "$ownership_file"
            mapfile -t observations < <(ip -o -4 address show dev "$interface" | awk -v target="$address/32" '$4 == target {print $1, $2, $4}')
            if [[ ${#observations[@]} -ne 1 ]]; then
              echo "could not uniquely observe generated-project identity: $address" >&2
              exit 1
            fi
            read -r observed_index observed_interface observed_address <<< "${observations[0]}"
            observed_index="${observed_index%:}"
            if [[ "$observed_index" != "$interface_index" || "$observed_interface" != "$interface" || "$observed_address" != "$address/32" ]]; then
              echo "generated-project identity does not match its intended interface: $address" >&2
              exit 1
            fi
          done

      - name: Exercise generated Compose service observation
        env:
          HARBOR_PROOF_ADDRESSES: 127.77.254.10,127.77.254.11,127.77.254.12
        run: go test -tags='projectidentityacceptance projectdockeracceptance' -count=1 -timeout=10m -run '^TestNativeGeneratedMySQLProjectsExposeComposeServices$' ./internal/reconcile

      - name: Verify Docker product evidence
        run: go run ./cmd/platformproof verify-docker-projects --root "${HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY}" --commit "${GITHUB_SHA}" --platforms linux --app-port 3000 --service-port 3306

      - name: Remove generated-project proof identities
        if: always()
        run: |
          ownership_file="${RUNNER_TEMP}/harbor-generated-project-identities"
          if [[ -f "$ownership_file" ]]; then
            while IFS=$'\t' read -r interface expected_index address extra; do
              if [[ -n "$extra" || -z "$interface" || -z "$expected_index" || -z "$address" ]]; then
                echo "invalid generated-project ownership record" >&2
                exit 1
              fi
              current_index="$(cat "/sys/class/net/${interface}/ifindex" 2>/dev/null || true)"
              mapfile -t observations < <(ip -o -4 address show dev "$interface" 2>/dev/null | awk -v target="$address/32" '$4 == target {print $1, $2, $4}')
              if [[ "$current_index" != "$expected_index" || ${#observations[@]} -ne 1 ]]; then
                echo "generated-project identity ownership changed; refusing to remove $address" >&2
                exit 1
              fi
              read -r observed_index observed_interface observed_address <<< "${observations[0]}"
              observed_index="${observed_index%:}"
              if [[ "$observed_index" != "$expected_index" || "$observed_interface" != "$interface" || "$observed_address" != "$address/32" ]]; then
                echo "generated-project identity observation changed; refusing to remove $address" >&2
                exit 1
              fi
              sudo ip address delete "$address/32" dev "$interface"
            done < "$ownership_file"
          fi

      - name: Upload Docker product evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-product-proof-linux
          path: ${{ env.HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7
