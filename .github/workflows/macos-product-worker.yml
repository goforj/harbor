name: macOS product worker evidence

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed default-branch commit SHA to admit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-product-worker-evidence
  cancel-in-progress: false

jobs:
  admit:
    name: Admit reviewed source
    runs-on: ubuntu-24.04
    outputs:
      approved_sha: ${{ steps.admit.outputs.approved_sha }}
    steps:
      - name: Check out protected workflow source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require exact dispatched default-branch head
        id: admit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          printf 'approved_sha=%s\n' "$APPROVED_SHA" >> "$GITHUB_OUTPUT"

  profile:
    name: Prove macOS 15 Docker and trusted HTTPS lifecycle
    needs: admit
    environment: macos-product-evidence
    runs-on: [self-hosted, ephemeral, harbor-product, macos, arm64]
    timeout-minutes: 60
    env:
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
    steps:
      - name: Check out admitted source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.admit.outputs.approved_sha }}
          persist-credentials: false
          clean: true

      - name: Check out pinned GoForj source
        uses: actions/checkout@v7
        with:
          repository: goforj/goforj
          ref: 86d7fcacd681d9f9798b7f47521ce14969a594f6
          path: .ci/goforj
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .ci/goforj/go.sum

      - name: Prove interactive product prerequisites
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.admit.outputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]

          process_user="$(id -un)"
          console_user="$(stat -f '%Su' /dev/console)"
          [[ "$process_user" != "root" ]]
          [[ "$console_user" == "$process_user" ]]
          launchctl print "gui/$(id -u)" >/dev/null

          product_version="$(sw_vers -productVersion)"
          build_version="$(sw_vers -buildVersion)"
          [[ "$product_version" =~ ^15\.[0-9]+(\.[0-9]+)?$ ]]
          [[ -n "$build_version" ]]

          user_keychain="$(security default-keychain -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
          [[ "$user_keychain" == /* ]]
          [[ -f "$user_keychain" ]]
          security list-keychains -d user >/dev/null

          [[ ! -e "/Library/Application Support/GoForj/Harbor/Privileged" ]]
          [[ ! -e "/etc/resolver/test" ]]

          docker_provider="$(docker info --format '{{.OperatingSystem}}')"
          docker_endpoint="$(docker context inspect --format '{{(index .Endpoints "docker").Host}}' "$(docker context show)")"
          docker_engine_version="$(docker version --format '{{.Server.Version}}')"
          [[ -n "$docker_provider" ]]
          [[ "$docker_endpoint" == unix:///* ]]
          [[ -n "$docker_engine_version" ]]
          [[ "$docker_provider" != *$'\n'* ]]
          [[ "$docker_provider" != *$'\r'* ]]

          evidence_directory="${RUNNER_TEMP}/harbor-macos-product-worker-evidence"
          [[ ! -e "$evidence_directory" ]]
          install -d -m 0700 "$evidence_directory"
          jq -n \
            --arg commit "$APPROVED_SHA" \
            --arg runner_name "$RUNNER_NAME" \
            --arg product_version "$product_version" \
            --arg build_version "$build_version" \
            --arg process_user "$process_user" \
            --arg console_user "$console_user" \
            --arg user_keychain "$user_keychain" \
            --arg docker_provider "$docker_provider" \
            --arg docker_endpoint "$docker_endpoint" \
            --arg docker_engine_version "$docker_engine_version" \
            '{
              schema_version: 1,
              capability: "macos_product_worker_profile",
              scope: "preflight",
              profile: "macos-15-arm64",
              commit: $commit,
              runner_name: $runner_name,
              goos: "darwin",
              goarch: "arm64",
              product_version: $product_version,
              build_version: $build_version,
              process_user: $process_user,
              console_user: $console_user,
              interactive_session: true,
              user_keychain: $user_keychain,
              resolver_directory: "/etc/resolver",
              low_port_mechanism: "launchd-socket",
              docker_provider: $docker_provider,
              docker_endpoint: $docker_endpoint,
              docker_engine_version: $docker_engine_version,
              assertions: [
                {id: "worker.apple_silicon", passed: true, detail: "native arm64 kernel and process"},
                {id: "worker.clean_harbor_state", passed: true, detail: "fixed Harbor resolver and privileged roots absent"},
                {id: "worker.current_user_keychain", passed: true, detail: "direct current-user default keychain available"},
                {id: "worker.interactive_login", passed: true, detail: "process user owns the active console GUI session"},
                {id: "worker.local_docker", passed: true, detail: "user-selected local Docker-compatible Engine 28 or newer"}
              ]
            }' > "${evidence_directory}/macos-worker-profile.json"
          chmod 0600 "${evidence_directory}/macos-worker-profile.json"
          go run ./cmd/platformproof verify-macos-worker \
            --root "$evidence_directory" \
            --commit "$APPROVED_SHA" \
            --product-major 15
          provider_file="${RUNNER_TEMP}/harbor-macos-docker-provider"
          [[ ! -e "$provider_file" ]]
          printf '%s' "$docker_provider" > "$provider_file"
          chmod 0600 "$provider_file"
          printf 'HARBOR_MACOS_WORKER_EVIDENCE_DIRECTORY=%s\n' "$evidence_directory" >> "$GITHUB_ENV"
          printf 'HARBOR_MACOS_DOCKER_PROVIDER_FILE=%s\n' "$provider_file" >> "$GITHUB_ENV"

      - name: Upload bounded worker profile evidence
        uses: actions/upload-artifact@v7
        with:
          name: macos-product-worker-profile
          path: ${{ env.HARBOR_MACOS_WORKER_EVIDENCE_DIRECTORY }}/macos-worker-profile.json
          if-no-files-found: error
          retention-days: 14

      - name: Build product binaries and pinned GoForj tools
        shell: bash
        run: |
          set -euo pipefail
          binary_directory="${RUNNER_TEMP}/harbor-bin"
          binary="${binary_directory}/forj"
          [[ ! -e "$binary_directory" ]]
          install -d -m 0700 "$binary_directory"
          go build -trimpath -o "${binary_directory}/harbor" ./cmd/app
          go build -trimpath -o "${binary_directory}/harbord" ./cmd/harbord
          go build -trimpath -o "${binary_directory}/helper" ./cmd/helper
          go build -trimpath -o "${binary_directory}/devbootstrap" ./cmd/devbootstrap
          go build -trimpath -o "${binary_directory}/launchdrelay" ./cmd/launchdrelay
          (
            cd .ci/goforj
            go build -trimpath -o "$binary" ./cmd/forj
          )
          GOBIN="$binary_directory" go install github.com/goforj/wire/cmd/wire@v1.2.0
          printf 'HARBOR_PROJECT_IDENTITY_FORJ_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
          printf 'HARBOR_MACOS_PRODUCT_BINARY_DIRECTORY=%s\n' "$binary_directory" >> "$GITHUB_ENV"
          printf '%s\n' "$binary_directory" >> "$GITHUB_PATH"

      - name: Require provisioner-owned proof identities
        shell: bash
        run: |
          set -euo pipefail
          for address in 127.77.254.10 127.77.254.11 127.77.254.12; do
            count="$(ifconfig lo0 inet | awk -v target="$address" '$1 == "inet" && $2 == target {count++} END {print count+0}')"
            if [[ "$count" != "1" ]]; then
              echo "product worker must expose exactly one provisioner-owned lo0 identity for $address; found $count" >&2
              exit 1
            fi
          done

      - name: Exercise generated Compose lifecycle
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.admit.outputs.approved_sha }}
          HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY: ${{ runner.temp }}/harbor-macos-docker-product-evidence
          HARBOR_PROOF_ADDRESSES: 127.77.254.10,127.77.254.11,127.77.254.12
        run: |
          set -euo pipefail
          [[ ! -e "$HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY" ]]
          docker_provider="$(<"$HARBOR_MACOS_DOCKER_PROVIDER_FILE")"
          [[ -n "$docker_provider" ]]
          HARBOR_DOCKER_PRODUCT_COMMIT="$APPROVED_SHA" \
          HARBOR_DOCKER_PRODUCT_RUNNER_NAME="$RUNNER_NAME" \
          HARBOR_DOCKER_PRODUCT_RUNNER_IMAGE="macos-15-arm64" \
          HARBOR_DOCKER_PRODUCT_RUNNER_IMAGE_VERSION="$(sw_vers -buildVersion)" \
          HARBOR_DOCKER_PRODUCT_ENGINE_KIND="$docker_provider" \
            go test \
              -tags='projectidentityacceptance projectdockeracceptance' \
              -count=1 \
              -timeout=10m \
              -run '^TestNativeGeneratedMySQLProjectsExposeComposeServices$' \
              ./internal/reconcile
          go run ./cmd/platformproof verify-docker-projects \
            --root "$HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY" \
            --commit "$APPROVED_SHA" \
            --platforms darwin \
            --app-port 3000 \
            --service-port 3306
          printf 'HARBOR_MACOS_DOCKER_EVIDENCE_DIRECTORY=%s\n' "$HARBOR_DOCKER_PRODUCT_EVIDENCE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Upload bounded Docker lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: macos-docker-product-lifecycle
          path: ${{ env.HARBOR_MACOS_DOCKER_EVIDENCE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 14

      - name: Install reviewed development helper
        shell: bash
        run: |
          set -euo pipefail
          sudo -n "${HARBOR_MACOS_PRODUCT_BINARY_DIRECTORY}/devbootstrap" \
            --helper "${HARBOR_MACOS_PRODUCT_BINARY_DIRECTORY}/helper" \
            --launchd-relay "${HARBOR_MACOS_PRODUCT_BINARY_DIRECTORY}/launchdrelay" \
            --user-id "$(id -u)" \
            --group-id "$(id -g)"

      - name: Exercise genuine Authorization Services approval
        shell: bash
        env:
          HARBOR_DARWIN_AUTHORIZATION_PREFLIGHT: "1"
        run: |
          set -euo pipefail
          go test \
            -tags=phase1acceptance \
            -count=1 \
            -timeout=5m \
            -run '^TestDarwinAuthorizationPreflight$' \
            ./internal/helper/launcher

      - name: Exercise three-project trusted HTTPS lifecycle
        shell: bash
        env:
          HARBOR_TRUSTED_HTTPS_ACCEPTANCE: "1"
          HARBOR_TRUSTED_HTTPS_FORJ_BINARY: ${{ runner.temp }}/harbor-bin/forj
          HARBOR_TRUSTED_HTTPS_FORJ_VERSION: "0.21.0"
          HARBOR_PHASE1_CLI_BINARY: ${{ runner.temp }}/harbor-bin/harbor
          HARBOR_PHASE1_DAEMON_BINARY: ${{ runner.temp }}/harbor-bin/harbord
          HARBOR_PHASE1_EVIDENCE_DIRECTORY: ${{ runner.temp }}/harbor-macos-trusted-https-evidence
        run: |
          set -euo pipefail
          [[ "$(command -v forj)" == "${HARBOR_MACOS_PRODUCT_BINARY_DIRECTORY}/forj" ]]
          [[ "$(command -v wire)" == "${HARBOR_MACOS_PRODUCT_BINARY_DIRECTORY}/wire" ]]
          go test \
            -tags=phase1acceptance \
            -count=1 \
            -timeout=25m \
            -run '^TestDarwinTrustedHTTPSIntermediateNativeLifecycle$' \
            ./internal/acceptance
          go run ./cmd/platformproof verify-trusted-https \
            --root "$HARBOR_PHASE1_EVIDENCE_DIRECTORY" \
            --platform darwin

      - name: Remove development bootstrap artifacts after failure
        if: failure() || cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if sudo -n launchctl print system/com.goforj.harbor.launchdrelay >/dev/null 2>&1; then
            sudo -n launchctl bootout system/com.goforj.harbor.launchdrelay
          fi
          sudo -n rm -f \
            /Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist \
            /Library/PrivilegedHelperTools/com.goforj.harbor.helper \
            /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay \
            /etc/resolver/test
          if sudo -n test -e "/Library/Application Support/GoForj/Harbor/Privileged"; then
            sudo -n rm -rf "/Library/Application Support/GoForj/Harbor/Privileged"
          fi
          sudo -n rmdir "/Library/Application Support/GoForj/Harbor" 2>/dev/null || true
          sudo -n rmdir "/Library/Application Support/GoForj" 2>/dev/null || true
          sudo -n rmdir /etc/resolver 2>/dev/null || true
          while IFS= read -r path; do
            if sudo -n test -e "$path" || sudo -n test -L "$path"; then
              printf 'Harbor bootstrap cleanup left path: %s\n' "$path" >&2
              exit 1
            fi
          done <<'EOF'
          /Library/Application Support/GoForj/Harbor/Privileged
          /Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist
          /Library/PrivilegedHelperTools/com.goforj.harbor.helper
          /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          /etc/resolver/test
          EOF

      - name: Upload bounded trusted HTTPS lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-trusted-https-product-lifecycle
          path: ${{ runner.temp }}/harbor-macos-trusted-https-evidence
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify macOS product-worker evidence
    needs: [admit, profile]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verifier source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.admit.outputs.approved_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download worker evidence
        uses: actions/download-artifact@v8
        with:
          name: macos-product-worker-profile
          path: macos-product-worker-evidence

      - name: Download Docker lifecycle evidence
        uses: actions/download-artifact@v8
        with:
          name: macos-docker-product-lifecycle
          path: macos-docker-product-evidence

      - name: Download trusted HTTPS lifecycle evidence
        uses: actions/download-artifact@v8
        with:
          name: macos-trusted-https-product-lifecycle
          path: macos-trusted-https-evidence

      - name: Enforce exact product evidence
        run: |
          go run ./cmd/platformproof verify-macos-worker \
            --root macos-product-worker-evidence \
            --commit "${{ needs.admit.outputs.approved_sha }}" \
            --product-major 15
          go run ./cmd/platformproof verify-docker-projects \
            --root macos-docker-product-evidence \
            --commit "${{ needs.admit.outputs.approved_sha }}" \
            --platforms darwin \
            --app-port 3000 \
            --service-port 3306
          go run ./cmd/platformproof verify-trusted-https \
            --root macos-trusted-https-evidence \
            --platform darwin
