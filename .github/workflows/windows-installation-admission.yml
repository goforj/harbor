name: Windows installation admission

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-installation-admission.yml
      - internal/platform/windowsinstallation/**
      - internal/platform/daemonservice/*windows*

permissions:
  contents: read

jobs:
  foundation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare disposable signed admission fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "harbor-installation-admission"
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $env:GOCACHE = Join-Path $fixture "gocache"
          $env:GOMODCACHE = Join-Path $fixture "gomodcache"
          "GOCACHE=$env:GOCACHE" | Out-File $env:GITHUB_ENV -Append
          "GOMODCACHE=$env:GOMODCACHE" | Out-File $env:GITHUB_ENV -Append
          go test -c -tags=release -o "$fixture\admission.test.exe" ./internal/platform/windowsinstallation
          if ($LASTEXITCODE -ne 0) { throw "native admission test build failed" }
          Copy-Item "$fixture\admission.test.exe" "$fixture\signed.exe"
          Copy-Item -LiteralPath packaging\windows\harbor-daemon-task.ps1 -Destination "$fixture\signed.ps1"
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Harbor Disposable Native Admission" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddHours(2)
          Export-Certificate -Cert $certificate -FilePath "$fixture\signer.cer" | Out-Null
          Import-Certificate -FilePath "$fixture\signer.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath "$fixture\signer.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $certificate.Thumbprint | Set-Content "$fixture\publisher.txt"
          go build -tags=release -trimpath -ldflags "-X github.com/goforj/harbor/internal/platform/windowsinstallation.PublisherThumbprint=$($certificate.Thumbprint)" -o "$fixture\maintenance.exe" ./cmd/installer
          if ($LASTEXITCODE -ne 0) { throw "native maintenance fixture build failed" }
          foreach ($path in @("$fixture\signed.exe", "$fixture\signed.ps1", "$fixture\maintenance.exe")) {
            $signature = Set-AuthenticodeSignature -FilePath $path -Certificate $certificate -HashAlgorithm SHA256
            if ($signature.Status -ne "Valid") { throw "fixture signature is not valid" }
          }
          $protected = Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "HarborAdmission-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $protected | Out-Null
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetSecurityDescriptorSddlForm("O:BAD:P(A;OICI;FA;;;BA)(A;OICI;FA;;;SY)(A;OICI;GRGX;;;BU)")
          Set-Acl -LiteralPath $protected -AclObject $acl
          "HARBOR_ADMISSION_FIXTURE_ROOT=$protected" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_ADMISSION_PUBLISHER=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_ADMISSION_SIGNED_PE=$fixture\signed.exe" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_ADMISSION_SIGNED_SCRIPT=$fixture\signed.ps1" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_ADMISSION_MAINTENANCE_AGENT=$fixture\maintenance.exe" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_ADMISSION_CERTIFICATE=$fixture\signer.cer" | Out-File $env:GITHUB_ENV -Append
      - name: Prove exact native admission and drift refusal
        working-directory: internal/platform/windowsinstallation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:RUNNER_TEMP\harbor-installation-admission\admission.test.exe" '-test.v' '-test.timeout=5m' 2>&1 | Tee-Object "$env:RUNNER_TEMP\windows-installation-admission.log"
          if ($LASTEXITCODE -ne 0) { throw "native installation admission failed" }
      - name: Retain bounded native loader failure diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $observations = @()
          foreach ($log in @('Application','System')) {
            try {
              $events = @(Get-WinEvent -FilterHashtable @{ LogName=$log; StartTime=(Get-Date).AddMinutes(-10) } -MaxEvents 200 -ErrorAction Stop | Where-Object { $_.Message -match '(?i)(HarborUninstall|maintenance|admission\.test)\.exe' } | ForEach-Object {
                [ordered]@{ log=$log; time=$_.TimeCreated.ToUniversalTime().ToString('o'); id=$_.Id; provider=$_.ProviderName; message=$_.Message }
              })
              $observations += [ordered]@{ log=$log; matching_events=$events }
            } catch {
              $observations += [ordered]@{ log=$log; observation_error=$_.Exception.Message }
            }
          }
          ConvertTo-Json -InputObject $observations -Depth 6 | Set-Content "$env:RUNNER_TEMP\windows-installation-loader-events.json" -Encoding utf8NoBOM
      - name: Prove native migration singleton and unsafe runtime refusal
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          go test ./internal/platform/daemonservice -run '^TestWindowsPreparation' -count=1 -timeout=3m -v 2>&1 | Tee-Object "$env:RUNNER_TEMP\windows-migration-preparation.log"
          if ($LASTEXITCODE -ne 0) { throw "native migration preparation failed" }
      - name: Prove privileged machine writer serialization
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          go test ./internal/platform/windowsmachine -count=1 -timeout=1m -v
          if ($LASTEXITCODE -ne 0) { throw "native machine transaction tests failed" }
          go test ./cmd/helper -run '^TestHelper(DependencyBoundary|HasOnlyReviewedRuntimeDependencies)$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "privileged helper dependency boundary failed" }
      - name: Validate native stable launcher orchestration
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          go test ./cmd/daemonlauncher ./cmd/desktoplauncher ./cmd/clilauncher ./cmd/installer ./cmd/windowssetup -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "native stable launcher tests failed" }
      - name: Validate native desktop task activation adapter
        if: ${{ !cancelled() }}
        working-directory: desktop
        shell: pwsh
        run: |
          go test -tags=release ./internal/daemonprerequisite -run '^TestWindowsEnsure' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "native desktop activation adapter tests failed" }
      - name: Remove only this worker's disposable fixtures
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "harbor-installation-admission"
          $thumbprintFile = Join-Path $fixture "publisher.txt"
          if (Test-Path -LiteralPath $thumbprintFile) {
            $thumbprint = (Get-Content -LiteralPath $thumbprintFile -Raw).Trim()
            if ($thumbprint -cnotmatch '^[A-F0-9]{40}$') { throw "invalid disposable publisher receipt" }
            foreach ($store in @("Cert:\LocalMachine\Root", "Cert:\LocalMachine\TrustedPublisher", "Cert:\CurrentUser\My")) {
              $path = Join-Path $store $thumbprint
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            }
          }
          $protected = Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "HarborAdmission-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $protected) { Remove-Item -LiteralPath $protected -Recurse -Force }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installation-admission
          path: |
            ${{ runner.temp }}/windows-installation-admission.log
            ${{ runner.temp }}/windows-migration-preparation.log
            ${{ runner.temp }}/windows-installation-loader-events.json
          if-no-files-found: warn
          retention-days: 14
