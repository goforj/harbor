name: Windows packaged-product gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part semantic base version for this disposable-signed development installer
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  package:
    name: Windows Server 2025 amd64 installed foundation
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Admit clean disposable package worker
        shell: pwsh
        env:
          HARBOR_REQUESTED_VERSION: ${{ inputs.version }}
          HARBOR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HARBOR_RUNNER_ENVIRONMENT -cne 'github-hosted' -or -not [Environment]::Is64BitOperatingSystem) { throw 'fresh hosted 64-bit Windows is required' }
          if (@(git status --porcelain).Count -ne 0 -or (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'checkout is not the exact clean source' }
          if ($env:HARBOR_REQUESTED_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'version must contain exactly three numeric parts' }
          foreach ($path in @("$env:ProgramFiles\GoForj\Harbor", "$env:ProgramData\GoForj\Harbor", 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GoForjHarbor')) {
            if (Test-Path -LiteralPath $path) { throw "preexisting Harbor state: $path" }
          }
          if (@(Get-ScheduledTask | Where-Object TaskName -like 'GoForjHarborDaemon-*').Count -ne 0) { throw 'preexisting Harbor scheduled task' }
          $version = "$env:HARBOR_REQUESTED_VERSION-dev.$env:GITHUB_RUN_NUMBER"
          $components = Join-Path $env:RUNNER_TEMP 'harbor-windows-components'
          New-Item -ItemType Directory -Path $components | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\harbor-gocache", "$env:RUNNER_TEMP\harbor-gomodcache", "$env:RUNNER_TEMP\harbor-package-evidence" | Out-Null
          "GOCACHE=$env:RUNNER_TEMP\harbor-gocache" | Out-File $env:GITHUB_ENV -Append
          "GOMODCACHE=$env:RUNNER_TEMP\harbor-gomodcache" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_COMPONENT_ROOT=$components" | Out-File $env:GITHUB_ENV -Append
          "HARBOR_PACKAGE_PATH=$env:RUNNER_TEMP\GoForj-Harbor-windows-amd64-$version-unsigned.exe" | Out-File $env:GITHUB_ENV -Append
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preauthorize only this worker's disposable development signer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=GoForj Harbor Disposable Installed Development' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddHours(8)
          $certificate.Thumbprint | Set-Content "$env:RUNNER_TEMP\harbor-package-publisher.txt" -NoNewline
          $certificatePath = Join-Path $env:HARBOR_COMPONENT_ROOT 'harbor-helper-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
          foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\LocalMachine\TrustedPublisher')) {
            if (Test-Path -LiteralPath (Join-Path $store $certificate.Thumbprint)) { throw 'disposable signer was already trusted' }
            Import-Certificate -FilePath $certificatePath -CertStoreLocation $store | Out-Null
          }
          $certificate.Thumbprint | Out-File (Join-Path $env:HARBOR_COMPONENT_ROOT 'harbor-helper-signing-thumbprint.txt') -Encoding ascii -NoNewline
          "HARBOR_SIGNER_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
      - name: Build production frontend
        working-directory: desktop/frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'frontend dependency installation failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }
      - name: Install pinned native resource tooling
        shell: pwsh
        run: |
          $env:GOBIN = "$env:RUNNER_TEMP\harbor-build-tools"
          New-Item -ItemType Directory -Path $env:GOBIN | Out-Null
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32
          if ($LASTEXITCODE -ne 0) { throw 'pinned Wails tooling installation failed' }
          $env:GOBIN | Out-File $env:GITHUB_PATH -Append
      - name: Build and sign every admitted payload role
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ldflags = "-X github.com/goforj/harbor/internal/buildinfo.releaseVersion=$env:HARBOR_RELEASE_VERSION -X github.com/goforj/harbor/internal/platform/windowsinstallation.PublisherThumbprint=$env:HARBOR_SIGNER_THUMBPRINT"
          $env:HARBOR_DESKTOP_LDFLAGS = $ldflags
          Push-Location desktop
          try {
            wails3 build RELEASE=true
            if ($LASTEXITCODE -ne 0) { throw 'native desktop build failed' }
          } finally { Pop-Location }
          Copy-Item desktop\build\bin\harbor-desktop.exe (Join-Path $env:HARBOR_COMPONENT_ROOT 'harbor-desktop.exe')
          wails3 generate syso -arch amd64 -icon desktop/build/windows/icon.ico -info desktop/build/windows/info.json -manifest packaging/windows/maintenance.exe.manifest -out cmd/installer/harbor_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'maintenance asInvoker resource generation failed' }
          $roles = @{
            'harbor.exe'='./cmd/app'; 'harbord.exe'='./cmd/harbord'; 'harbor-helper.exe'='./cmd/helper'; 'outputbroker.exe'='./cmd/outputbroker'
            'desktop-launcher.exe'='./cmd/desktoplauncher'; 'daemon-launcher.exe'='./cmd/daemonlauncher'; 'cli-launcher.exe'='./cmd/clilauncher'; 'harbor-installer.exe'='./cmd/installer'
          }
          foreach ($entry in $roles.GetEnumerator()) {
            $flags = $ldflags
            if ($entry.Key -in @('desktop-launcher.exe','daemon-launcher.exe','harbor-installer.exe')) { $flags += ' -H=windowsgui' }
            go build -tags=release -trimpath -ldflags $flags -o (Join-Path $env:HARBOR_COMPONENT_ROOT $entry.Key) $entry.Value
            if ($LASTEXITCODE -ne 0) { throw "native role build failed: $($entry.Key)" }
          }
          Copy-Item packaging\windows\harbor-daemon-task.ps1, packaging\windows\harbor-uninstall.ps1 $env:HARBOR_COMPONENT_ROOT
          $certificate = Get-Item (Join-Path 'Cert:\CurrentUser\My' $env:HARBOR_SIGNER_THUMBPRINT)
          Get-ChildItem -LiteralPath $env:HARBOR_COMPONENT_ROOT -File | Where-Object Extension -in @('.exe','.ps1') | ForEach-Object {
            $signature = Set-AuthenticodeSignature -LiteralPath $_.FullName -Certificate $certificate -HashAlgorithm SHA256
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -cne $env:HARBOR_SIGNER_THUMBPRINT) { throw "payload signature failed: $($_.Name)" }
          }
      - name: Seal payload and sign native embedded setup last
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./cmd/windowsseal -components $env:HARBOR_COMPONENT_ROOT -output cmd/windowssetup/payload -version $env:HARBOR_RELEASE_VERSION -revision $env:GITHUB_SHA -publisher $env:HARBOR_SIGNER_THUMBPRINT -sequence $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'signed payload sealing failed' }
          wails3 generate syso -arch amd64 -icon desktop/build/windows/icon.ico -info desktop/build/windows/info.json -manifest packaging/windows/setup.exe.manifest -out cmd/windowssetup/harbor_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'setup elevation resource generation failed' }
          $ldflags = "-H=windowsgui -X github.com/goforj/harbor/internal/platform/windowsinstallation.PublisherThumbprint=$env:HARBOR_SIGNER_THUMBPRINT"
          go build -tags=release -trimpath -ldflags $ldflags -o $env:HARBOR_PACKAGE_PATH ./cmd/windowssetup
          if ($LASTEXITCODE -ne 0) { throw 'embedded native setup build failed' }
          $certificate = Get-Item (Join-Path 'Cert:\CurrentUser\My' $env:HARBOR_SIGNER_THUMBPRINT)
          $signature = Set-AuthenticodeSignature -LiteralPath $env:HARBOR_PACKAGE_PATH -Certificate $certificate -HashAlgorithm SHA256
          if ($signature.Status -ne 'Valid') { throw 'outer setup signature failed' }
          $digest = (Get-FileHash $env:HARBOR_PACKAGE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $([IO.Path]::GetFileName($env:HARBOR_PACKAGE_PATH))" | Out-File "$env:HARBOR_PACKAGE_PATH.sha256" -Encoding ascii
      - name: Install exact sealed package and admit machine integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Start-Process -FilePath $env:HARBOR_PACKAGE_PATH -ArgumentList '--silent' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\harbor-package-evidence\setup-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP\harbor-package-evidence\setup-stderr.txt"
          if ($installed.ExitCode -ne 0) { throw "native setup failed: $($installed.ExitCode)" }
          $root = "$env:ProgramFiles\GoForj\Harbor"
          $selection = Get-Content -LiteralPath "$root\installation.json" -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath "$root\releases\$($selection.release_sequence)\release-manifest.json" -Raw | ConvertFrom-Json
          if ($selection.signer_thumbprint -cne $env:HARBOR_SIGNER_THUMBPRINT -or $manifest.source_revision -cne $env:GITHUB_SHA) { throw 'installed selection/source drifted' }
          foreach ($component in $manifest.components) {
            $source = Join-Path 'cmd\windowssetup\payload' $component.path
            $target = Join-Path $root $component.path
            if ((Get-FileHash $source -Algorithm SHA256).Hash -cne (Get-FileHash $target -Algorithm SHA256).Hash) { throw "installed component drifted: $($component.role)" }
          }
          if (-not (Test-Path "$root\installation-integration.json")) { throw 'machine integration receipt missing' }
          $taskName = "GoForjHarborDaemon-$($selection.user_sid)"
          if (@(Get-ScheduledTask -TaskName $taskName -ErrorAction Stop).Count -ne 1) { throw 'owned task missing' }
          if (@(Get-Process -Name harbord -ErrorAction SilentlyContinue).Count -ne 0) { throw 'installer unexpectedly started user daemon' }
          $selection | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\harbor-package-evidence\installed-selection.json" -Encoding utf8NoBOM
          "HARBOR_INSTALL_ROOT=$root" | Out-File $env:GITHUB_ENV -Append
      - name: Observe normal uninstall continuation and preserve foreign files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sentinel = Join-Path $env:HARBOR_INSTALL_ROOT 'foreign-package-sentinel.txt'
          [IO.File]::WriteAllText($sentinel, 'preserve foreign package state')
          $baseline = @(Get-ChildItem "$env:WINDIR\Temp" -Directory -Filter 'HarborUninstall-*' | ForEach-Object FullName)
          $process = Start-Process "$env:HARBOR_INSTALL_ROOT\Uninstall.exe" -ArgumentList '--silent' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\harbor-package-evidence\uninstall-bootstrap-stdout.txt" -RedirectStandardError "$env:RUNNER_TEMP\harbor-package-evidence\uninstall-bootstrap-stderr.txt"
          if ($process.ExitCode -ne 0) { throw "uninstall bootstrap failed: $($process.ExitCode)" }
          $deadline = (Get-Date).AddMinutes(3)
          $receiptPath = $null
          do {
            $stages = @(Get-ChildItem "$env:WINDIR\Temp" -Directory -Filter 'HarborUninstall-*' | Where-Object FullName -notin $baseline)
            if ($stages.Count -gt 1) { throw 'unexpected uninstall continuation stages' }
            if ($stages.Count -eq 1) { $receiptPath = Join-Path $stages[0].FullName 'result.json' }
            if ($receiptPath -and (Test-Path $receiptPath)) {
              try {
                $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
                if ($receipt.schema_version -eq 1 -and $receipt.status -in @('complete','failed')) { break }
              } catch { }
            }
            Start-Sleep -Milliseconds 200
          } while ((Get-Date) -lt $deadline)
          if (-not $receipt -or $receipt.schema_version -ne 1) { throw 'complete protected uninstall result was not observed' }
          Copy-Item $receiptPath "$env:RUNNER_TEMP\harbor-package-evidence\uninstall-result.json"
          $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
          $selection = Get-Content "$env:RUNNER_TEMP\harbor-package-evidence\installed-selection.json" -Raw | ConvertFrom-Json
          if ($receipt.status -cne 'complete' -or $receipt.installation_id -cne $selection.installation_id -or $receipt.bundle_digest -cne $selection.bundle_digest) { throw "uninstall did not complete: $($receipt.error)" }
          if ((Get-Content $sentinel -Raw) -cne 'preserve foreign package state') { throw 'foreign state changed' }
          if (@(Get-ChildItem $env:HARBOR_INSTALL_ROOT -Force).Count -ne 1) { throw 'owned package files remain' }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GoForjHarbor') { throw 'uninstall registration remains' }
          if (Get-ScheduledTask -TaskName "GoForjHarborDaemon-$($selection.user_sid)" -ErrorAction SilentlyContinue) { throw 'owned task remains' }
          if (Test-Path "$env:ProgramData\GoForj\Harbor") { throw 'owned helper spool remains' }
          foreach ($store in @('Cert:\LocalMachine\Root','Cert:\LocalMachine\TrustedPublisher')) {
            if (-not (Test-Path (Join-Path $store $env:HARBOR_SIGNER_THUMBPRINT))) { throw 'product uninstall removed externally authorized signer trust' }
          }
          Remove-Item -LiteralPath $sentinel
          Remove-Item -LiteralPath $env:HARBOR_INSTALL_ROOT
          @{ installed_foundation='passed'; daemon_prestart=$false; foreign_files='preserved'; external_signer_trust='preserved'; installed_gui='separate acceptance workflow' } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\harbor-package-evidence\summary.json" -Encoding utf8NoBOM
      - name: Record exact tested package provenance
        shell: pwsh
        run: |
          $name = [IO.Path]::GetFileName($env:HARBOR_PACKAGE_PATH)
          $digest = (Get-FileHash $env:HARBOR_PACKAGE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ schema_version=1; source_commit=$env:GITHUB_SHA; workflow_run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; version=$env:HARBOR_RELEASE_VERSION; packages=@{ $name=$digest } } | ConvertTo-Json -Depth 4 | Set-Content "$env:HARBOR_PACKAGE_PATH.provenance.json" -Encoding utf8NoBOM
      - name: Remove only the disposable development signing authorization
        if: always()
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\harbor-package-publisher.txt"
          if (Test-Path $path) {
            $thumbprint = (Get-Content $path -Raw).Trim()
            if ($thumbprint -cnotmatch '^[A-F0-9]{40}$') { throw 'invalid disposable signer receipt' }
            foreach ($store in @('Cert:\CurrentUser\My','Cert:\LocalMachine\Root','Cert:\LocalMachine\TrustedPublisher')) {
              $entry = Join-Path $store $thumbprint
              if (Test-Path $entry) { Remove-Item -LiteralPath $entry -Force }
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: GoForj-Harbor-windows-amd64-${{ env.HARBOR_RELEASE_VERSION }}-tested
          path: |
            ${{ env.HARBOR_PACKAGE_PATH }}
            ${{ env.HARBOR_PACKAGE_PATH }}.sha256
            ${{ env.HARBOR_PACKAGE_PATH }}.provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: GoForj-Harbor-windows-amd64-packaged-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/harbor-package-evidence/
          if-no-files-found: error
          retention-days: 14
