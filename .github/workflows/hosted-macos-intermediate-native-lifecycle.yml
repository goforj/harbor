name: Hosted macOS intermediate native lifecycle evidence

# This workflow supplies hosted native lifecycle evidence. Its trusted HTTPS
# acceptance must prove product-driven machine-global release before the
# disposable runner safety net can remove any remaining state.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hosted-macos-intermediate-native-lifecycle.yml
      - app/**
      - cmd/app/**
      - cmd/devbootstrap/**
      - cmd/harbord/**
      - cmd/helper/**
      - cmd/launchdrelay/**
      - go.mod
      - go.sum
      - internal/**

permissions:
  contents: read

concurrency:
  group: hosted-macos-intermediate-native-lifecycle
  cancel-in-progress: false

env:
  HARBOR_INTERMEDIATE_NATIVE_FORJ_COMMIT: 86d7fcacd681d9f9798b7f47521ce14969a594f6

jobs:
  intermediate-native-lifecycle:
    name: Intermediate hosted native lifecycle evidence
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Admit default-branch GitHub-hosted execution
        shell: bash
        env:
          HARBOR_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
          HARBOR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$HARBOR_RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$GITHUB_REF" == "$HARBOR_EXPECTED_REF" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Require clean Harbor-owned host state
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if sudo -n test -e "$path" || sudo -n test -L "$path"; then
              printf 'preexisting Harbor-owned path: %s\n' "$path" >&2
              exit 1
            fi
          done <<'EOF'
          /Library/Application Support/GoForj/Harbor/Privileged
          /Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist
          /Library/PrivilegedHelperTools/com.goforj.harbor.helper
          /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          /etc/resolver/test
          EOF
          if sudo -n launchctl print system/com.goforj.harbor.launchdrelay >/dev/null 2>&1; then
            printf 'preexisting Harbor launchd relay service\n' >&2
            exit 1
          fi

      - name: Check out pinned GoForj source
        uses: actions/checkout@v7
        with:
          repository: goforj/goforj
          ref: ${{ env.HARBOR_INTERMEDIATE_NATIVE_FORJ_COMMIT }}
          path: .ci/goforj
          persist-credentials: false

      - name: Prepare isolated Go caches
        shell: bash
        run: |
          set -euo pipefail
          cache_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_cache="${RUNNER_TEMP}/harbor-gocache-${cache_identity}"
          module_cache="${RUNNER_TEMP}/harbor-gomodcache-${cache_identity}"
          install -d -m 0700 "$build_cache" "$module_cache"
          [[ "$(stat -f '%u:%g %Lp' "$build_cache")" == "$(id -u):$(id -g) 700" ]]
          [[ "$(stat -f '%u:%g %Lp' "$module_cache")" == "$(id -u):$(id -g) 700" ]]
          printf 'GOCACHE=%s\n' "$build_cache" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s\n' "$module_cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .ci/goforj/go.sum

      - name: Verify isolated Go caches
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOCACHE)" == "$GOCACHE" ]]
          [[ "$(go env GOMODCACHE)" == "$GOMODCACHE" ]]
          [[ "$(stat -f '%u:%g %Lp' "$GOCACHE")" == "$(id -u):$(id -g) 700" ]]
          [[ "$(stat -f '%u:%g %Lp' "$GOMODCACHE")" == "$(id -u):$(id -g) 700" ]]

      - name: Build production Harbor and GoForj binaries
        shell: bash
        run: |
          binary_directory="${RUNNER_TEMP}/harbor-intermediate-native-bin"
          mkdir -p "$binary_directory"
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go build -trimpath -o "${binary_directory}/harbor" ./cmd/app
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go build -trimpath -o "${binary_directory}/harbord" ./cmd/harbord
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go build -trimpath -o "${binary_directory}/helper" ./cmd/helper
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go build -trimpath -o "${binary_directory}/devbootstrap" ./cmd/devbootstrap
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go build -trimpath -o "${binary_directory}/launchdrelay" ./cmd/launchdrelay
          (
            cd .ci/goforj
            GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go build -trimpath -o "${binary_directory}/forj" ./cmd/forj
          )
          GOBIN="$binary_directory" GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" \
            go install github.com/goforj/wire/cmd/wire@v1.2.0
          printf 'HARBOR_INTERMEDIATE_NATIVE_BINARY_DIRECTORY=%s\n' "$binary_directory" >> "$GITHUB_ENV"
          printf '%s\n' "$binary_directory" >> "$GITHUB_PATH"

      - name: Verify native lifecycle failure diagnostics
        shell: bash
        run: |
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go test \
            -tags=phase1acceptance \
            -count=1 \
            -run '^TestTrustedHTTPS(DecodeProjectLifecycleResult|FinalizeCheckout.*|ProjectLifecycleTerminalErrorIncludesProblem|ValidateNetworkReleaseResultRejectsNonExactCompletion)$' \
            ./internal/acceptance

      - name: Preflight current-user keychain
        shell: bash
        run: |
          security list-keychains -d user
          security default-keychain -d user
          security find-certificate -a -p >/dev/null

      - name: Install development helper for the current user
        shell: bash
        run: |
          sudo -n "${HARBOR_INTERMEDIATE_NATIVE_BINARY_DIRECTORY}/devbootstrap" \
            --helper "${HARBOR_INTERMEDIATE_NATIVE_BINARY_DIRECTORY}/helper" \
            --launchd-relay "${HARBOR_INTERMEDIATE_NATIVE_BINARY_DIRECTORY}/launchdrelay" \
            --user-id "$(id -u)" \
            --group-id "$(id -g)"

      - name: Capture and allow hosted-runner authorization rights
        shell: bash
        run: |
          set -euo pipefail
          authorization_directory="/var/root/harbor-intermediate-native-authorizationdb"
          system_rule="${authorization_directory}/system.privilege.admin.original.plist"
          system_digest="${authorization_directory}/system.privilege.admin.original.sha256"
          trust_rule="${authorization_directory}/config.modify.trust-settings.original.plist"
          trust_digest="${authorization_directory}/config.modify.trust-settings.original.sha256"
          authorization_marker="${authorization_directory}/capture-complete"
          sudo -n test ! -e "$authorization_directory"
          sudo -n install -d -m 0700 -o root -g wheel "$authorization_directory"
          sudo -n /bin/sh -ceu '
            umask 077
            /usr/bin/security authorizationdb read system.privilege.admin > "$1"
            /usr/bin/plutil -lint "$1" >/dev/null
            /bin/test -s "$1"
            /usr/bin/shasum -a 256 "$1" > "$2"
            /usr/bin/security authorizationdb read config.modify.trust-settings > "$3"
            /usr/bin/plutil -lint "$3" >/dev/null
            /bin/test -s "$3"
            /usr/bin/shasum -a 256 "$3" > "$4"
            /usr/bin/touch "$5"
          ' harbor-authorization-capture \
            "$system_rule" \
            "$system_digest" \
            "$trust_rule" \
            "$trust_digest" \
            "$authorization_marker"
          sudo -n security authorizationdb write system.privilege.admin allow
          sudo -n security authorizationdb write config.modify.trust-settings allow

      - name: Run Darwin Authorization Services preflight diagnostic
        shell: bash
        env:
          HARBOR_DARWIN_AUTHORIZATION_PREFLIGHT: "1"
        run: |
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go test \
            -tags=phase1acceptance \
            -count=1 \
            -timeout=30s \
            -run '^TestDarwinAuthorizationPreflight$' \
            ./internal/helper/launcher

      - name: Run intermediate native lifecycle test
        shell: bash
        env:
          HARBOR_TRUSTED_HTTPS_ACCEPTANCE: "1"
          HARBOR_TRUSTED_HTTPS_FORJ_BINARY: ${{ runner.temp }}/harbor-intermediate-native-bin/forj
          HARBOR_TRUSTED_HTTPS_FORJ_VERSION: "0.21.0"
          HARBOR_PHASE1_CLI_BINARY: ${{ runner.temp }}/harbor-intermediate-native-bin/harbor
          HARBOR_PHASE1_DAEMON_BINARY: ${{ runner.temp }}/harbor-intermediate-native-bin/harbord
          HARBOR_PHASE1_EVIDENCE_DIRECTORY: ${{ github.workspace }}/harbor-intermediate-native-lifecycle-evidence
        run: |
          [[ "$(command -v forj)" == "${HARBOR_INTERMEDIATE_NATIVE_BINARY_DIRECTORY}/forj" ]]
          [[ "$(command -v wire)" == "${HARBOR_INTERMEDIATE_NATIVE_BINARY_DIRECTORY}/wire" ]]
          GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" go test \
            -tags=phase1acceptance \
            -count=1 \
            -timeout=25m \
            -run '^TestDarwinTrustedHTTPSIntermediateNativeLifecycle$' \
            ./internal/acceptance

      - name: Report bounded Harbor host state before cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /bin/sh -ceu '
            count_children() {
              if [ ! -d "$1" ]; then
                printf "host-state %s=absent\\n" "$2"
                return
              fi
              count=$(/bin/ls -1A "$1" | /usr/bin/head -n 33 | /usr/bin/wc -l | /usr/bin/tr -d " ")
              if [ "$count" -eq 33 ]; then
                printf "host-state %s=33+\\n" "$2"
                return
              fi
              printf "host-state %s=%s\\n" "$2" "$count"
            }
            report_presence() {
              if [ -e "$1" ] || [ -L "$1" ]; then
                printf "host-state %s=present\\n" "$2"
              else
                printf "host-state %s=absent\\n" "$2"
              fi
            }
            root="/Library/Application Support/GoForj/Harbor/Privileged"
            count_children "$root/tickets/pending" pending-tickets
            count_children "$root/tickets/claims" claims
            count_children "$root/state/replay" replay-tombstones
            report_presence "$root/state/ownership.json" ownership
            report_presence "/Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist" low-port-plist
            report_presence "/etc/resolver/test" resolver-file
            report_presence "/Library/PrivilegedHelperTools/com.goforj.harbor.helper" helper
            report_presence "/Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay" relay
          ' harbor-host-state
          printf '%s\n' 'host-state launchd-service-begin'
          sudo -n /bin/launchctl print system/com.goforj.harbor.launchdrelay 2>&1 |
            /usr/bin/head -c 16384 || true
          printf '\n%s\n' 'host-state launchd-service-end'
          printf '%s\n' 'host-state launchd-relay-log-begin'
          sudo -n /usr/bin/log show \
            --last 10m \
            --style compact \
            --predicate 'process == "com.goforj.harbor.launchdrelay"' 2>&1 |
            /usr/bin/tail -n 80 || true
          printf '\n%s\n' 'host-state launchd-relay-log-end'
          printf '%s\n' 'host-state low-port-listeners-begin'
          sudo -n /usr/sbin/lsof -nP \
            -iTCP:80 -iTCP:443 \
            -sTCP:LISTEN 2>&1 |
            /usr/bin/head -c 16384 || true
          printf '\n%s\n' 'host-state low-port-listeners-end'

      - name: Restore hosted-runner authorization rights
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          authorization_directory="/var/root/harbor-intermediate-native-authorizationdb"
          authorization_marker="${authorization_directory}/capture-complete"
          if ! sudo -n test -e "$authorization_directory"; then
            exit 0
          fi
          if ! sudo -n test -f "$authorization_marker"; then
            sudo -n find "$authorization_directory" -type f -delete
            sudo -n rmdir "$authorization_directory"
            exit 0
          fi
          sudo -n /bin/sh -ceu '
            normalize_authorization_policy() {
              /bin/cp "$1" "$2" || return 1
              for metadata in created modified; do
                if /usr/bin/plutil -type "$metadata" "$2" >/dev/null 2>&1; then
                  /usr/bin/plutil -remove "$metadata" "$2" || return 1
                fi
              done
              /usr/bin/plutil -convert json -r "$2" || return 1
            }
            restore_rule() {
              right="$1"
              original="$2"
              digest="$3"
              restored="${original}.restored"
              normalized_original="${original}.normalized.json"
              normalized_restored="${restored}.normalized.json"
              /usr/bin/shasum -a 256 -c "$digest" || return 1
              /usr/bin/security authorizationdb write "$right" < "$original" || return 1
              umask 077
              /usr/bin/security authorizationdb read "$right" > "$restored" || return 1
              # AuthorizationDB refreshes timestamps on write; every policy field remains compared.
              normalize_authorization_policy "$original" "$normalized_original" || return 1
              normalize_authorization_policy "$restored" "$normalized_restored" || return 1
              /usr/bin/cmp -s "$normalized_original" "$normalized_restored" || return 1
              /bin/rm -f "$normalized_restored" "$normalized_original" "$restored" "$digest" "$original" || return 1
            }
            restore_status=0
            restore_rule \
              config.modify.trust-settings \
              "$1/config.modify.trust-settings.original.plist" \
              "$1/config.modify.trust-settings.original.sha256" || restore_status=1
            restore_rule \
              system.privilege.admin \
              "$1/system.privilege.admin.original.plist" \
              "$1/system.privilege.admin.original.sha256" || restore_status=1
            if [ "$restore_status" -eq 0 ]; then
              /bin/rm -f "$2"
              /bin/rmdir "$1"
            fi
            exit "$restore_status"
          ' harbor-authorization-restore "$authorization_directory" "$authorization_marker"

      - name: Remove development bootstrap artifacts
        if: failure() || cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if sudo -n launchctl print system/com.goforj.harbor.launchdrelay >/dev/null 2>&1; then
            sudo -n launchctl bootout system/com.goforj.harbor.launchdrelay
          fi
          sudo -n rm -f \
            /Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist \
            /Library/PrivilegedHelperTools/com.goforj.harbor.helper \
            /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay \
            /etc/resolver/test
          if sudo -n test -e "/Library/Application Support/GoForj/Harbor/Privileged"; then
            sudo -n rm -rf "/Library/Application Support/GoForj/Harbor/Privileged"
          fi
          sudo -n rmdir "/Library/Application Support/GoForj/Harbor" 2>/dev/null || true
          sudo -n rmdir "/Library/Application Support/GoForj" 2>/dev/null || true
          sudo -n rmdir /etc/resolver 2>/dev/null || true
          while IFS= read -r path; do
            if sudo -n test -e "$path" || sudo -n test -L "$path"; then
              printf 'Harbor bootstrap cleanup left path: %s\n' "$path" >&2
              exit 1
            fi
          done <<'EOF'
          /Library/Application Support/GoForj/Harbor/Privileged
          /Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist
          /Library/PrivilegedHelperTools/com.goforj.harbor.helper
          /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          /etc/resolver/test
          EOF

      - name: Upload bounded Phase1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-macos-intermediate-native-lifecycle-phase1-evidence
          path: harbor-intermediate-native-lifecycle-evidence/summary.json
          if-no-files-found: error
          retention-days: 7
