name: macOS development package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part semantic base version for this unsigned development package
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*.*.*-rc.*"

permissions:
  contents: read

env:
  HARBOR_PACKAGED_FORJ_COMMIT: v0.22.0

jobs:
  package:
    name: Apple silicon PKG
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HARBOR_RELEASE_SEQUENCE: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure package paths
        env:
          HARBOR_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [[ ! "$HARBOR_REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "manual package version must contain exactly three numeric parts" >&2
                exit 1
              fi
              release_version="${HARBOR_REQUESTED_VERSION}-dev.${GITHUB_RUN_NUMBER}"
              ;;
            push)
              if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
                echo "release-candidate tag must match vMAJOR.MINOR.PATCH-rc.NUMBER" >&2
                exit 1
              fi
              release_version="${BASH_REMATCH[1]}"
              ;;
            *)
              echo "unsupported package event ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          payload_root="/Library/PrivilegedHelperTools/.goforj-harbor-payload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          package_path="${RUNNER_TEMP}/GoForj-Harbor-macos-arm64-${release_version}.pkg"
          sudo -n test ! -e "$payload_root"
          sudo -n install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$payload_root"
          echo "HARBOR_RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          echo "HARBOR_PAYLOAD_ROOT=${payload_root}" >> "${GITHUB_ENV}"
          echo "HARBOR_PACKAGE_PATH=${package_path}" >> "${GITHUB_ENV}"

      - name: Verify native package worker
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test -n "${GITHUB_SHA}"
          test "$(git status --porcelain)" = ""

      - name: Check out pinned GoForj source
        uses: actions/checkout@v7
        with:
          repository: goforj/goforj
          ref: ${{ env.HARBOR_PACKAGED_FORJ_COMMIT }}
          path: .ci/goforj
          persist-credentials: false

      - name: Prepare isolated Go caches
        run: |
          cache_identity="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_cache="${RUNNER_TEMP}/harbor-gocache-${cache_identity}"
          module_cache="${RUNNER_TEMP}/harbor-gomodcache-${cache_identity}"
          install -d -m 0700 "$build_cache" "$module_cache"
          test "$(stat -f '%u:%g %Lp' "$build_cache")" = "$(id -u):$(id -g) 700"
          test "$(stat -f '%u:%g %Lp' "$module_cache")" = "$(id -u):$(id -g) 700"
          printf 'GOCACHE=%s\n' "$build_cache" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s\n' "$module_cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
            .ci/goforj/go.sum

      - name: Verify isolated Go caches
        run: |
          test "$(go env GOCACHE)" = "$GOCACHE"
          test "$(go env GOMODCACHE)" = "$GOMODCACHE"
          test "$(stat -f '%u:%g %Lp' "$GOCACHE")" = "$(id -u):$(id -g) 700"
          test "$(stat -f '%u:%g %Lp' "$GOMODCACHE")" = "$(id -u):$(id -g) 700"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build production frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build release desktop
        working-directory: desktop
        run: |
          ldflags="-X github.com/goforj/harbor/internal/buildinfo.releaseVersion=${HARBOR_RELEASE_VERSION}"
          wails build -s -clean -platform darwin/arm64 -tags release -trimpath -ldflags "$ldflags" -o Harbor
          find build/bin/Harbor.app/Contents/Resources -maxdepth 3 -print | sort
          plutil -p build/bin/Harbor.app/Contents/Info.plist
          test -x build/bin/Harbor.app/Contents/MacOS/harbor-desktop
          test -f build/bin/Harbor.app/Contents/Resources/Assets.car
          test ! -e build/bin/Harbor.app/Contents/Resources/AppIcon.icon
          test ! -e build/bin/Harbor.app/Contents/Resources/AppIcon.icns
          test ! -e build/bin/Harbor.app/Contents/Resources/iconfile.icns
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" build/bin/Harbor.app/Contents/Info.plist; then
            echo "CFBundleIconFile still selects a competing legacy icon" >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" build/bin/Harbor.app/Contents/Info.plist)" = "AppIcon"
          test "$(lipo -archs build/bin/Harbor.app/Contents/MacOS/harbor-desktop)" = "arm64"

      - name: Stage fixed macOS payload
        run: |
          release_root="${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}"
          privileged_root="${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools"
          mkdir -p \
            "${HARBOR_PAYLOAD_ROOT}/Applications" \
            "${release_root}/bin" \
            "${release_root}/libexec" \
            "${privileged_root}" \
            "${HARBOR_PAYLOAD_ROOT}/usr/local/bin"
          cp -R desktop/build/bin/Harbor.app "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${HARBOR_RELEASE_VERSION}" "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${HARBOR_RELEASE_SEQUENCE}" "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 15.0" "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"

          ldflags="-X github.com/goforj/harbor/internal/buildinfo.releaseVersion=${HARBOR_RELEASE_VERSION}"
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/harbor" ./cmd/app
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/harbord" ./cmd/harbord
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/outputbroker" ./cmd/outputbroker
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/harbor-installer" ./cmd/installer
          go build -trimpath -ldflags "$ldflags" -o "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/daemon-launcher" ./cmd/daemonlauncher
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/libexec/com.goforj.harbor.helper" ./cmd/helper
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/libexec/com.goforj.harbor.launchdrelay" ./cmd/launchdrelay
          cp "${release_root}/libexec/com.goforj.harbor.helper" "${privileged_root}/com.goforj.harbor.helper"
          cp "${release_root}/libexec/com.goforj.harbor.launchdrelay" "${privileged_root}/com.goforj.harbor.launchdrelay"
          sudo -n chmod -N \
            "${privileged_root}/com.goforj.harbor.helper" \
            "${privileged_root}/com.goforj.harbor.launchdrelay"
          sudo -n chown root:wheel \
            "${privileged_root}/com.goforj.harbor.helper" \
            "${privileged_root}/com.goforj.harbor.launchdrelay"
          sudo -n chmod 4755 "${privileged_root}/com.goforj.harbor.helper"
          sudo -n chmod 0755 "${privileged_root}/com.goforj.harbor.launchdrelay"

          ln -s "releases/${HARBOR_RELEASE_SEQUENCE}" "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/current"
          ln -s "/Library/Application Support/GoForj/Harbor/current/bin/harbor" "${HARBOR_PAYLOAD_ROOT}/usr/local/bin/harbor"

      - name: Seal development release manifest
        run: |
          go run ./cmd/releasebundle \
            --payload "${HARBOR_PAYLOAD_ROOT}" \
            --version "${HARBOR_RELEASE_VERSION}" \
            --sequence "${HARBOR_RELEASE_SEQUENCE}" \
            --revision "${GITHUB_SHA}"
          sudo -n chown -R root:wheel "${HARBOR_PAYLOAD_ROOT}"
          sudo -n chmod 0755 "${HARBOR_PAYLOAD_ROOT}"
          sudo -n chmod 4755 "${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.helper"

      - name: Validate staged payload
        run: |
          plist="${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.goforj.harbor"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${HARBOR_RELEASE_VERSION}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${HARBOR_RELEASE_SEQUENCE}"
          test "$(readlink "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/current")" = "releases/${HARBOR_RELEASE_SEQUENCE}"

          while IFS= read -r executable; do
            architecture="$(lipo -archs "$executable")"
            printf 'staged executable architecture: %s=%s\n' "$executable" "$architecture"
            test "$architecture" = "arm64"
          done <<EOF
          ${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/MacOS/harbor-desktop
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/daemon-launcher
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/harbor
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/harbord
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/outputbroker
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/harbor-installer
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/libexec/com.goforj.harbor.helper
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/libexec/com.goforj.harbor.launchdrelay
          ${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.helper
          ${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          EOF
          helper_identity="$(stat -f '%u:%g %Sp' "${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.helper")"
          printf 'staged fixed helper identity: %s\n' "$helper_identity"
          test "$helper_identity" = "0:0 -rwsr-xr-x"

      - name: Assemble unsigned installer package
        run: |
          pkgbuild \
            --root "${HARBOR_PAYLOAD_ROOT}" \
            --scripts packaging/darwin/scripts \
            --identifier com.goforj.harbor \
            --version "${HARBOR_RELEASE_VERSION}" \
            --install-location / \
            "${HARBOR_PACKAGE_PATH}"

      - name: Inspect installer payload
        run: |
          pkgutil --payload-files "${HARBOR_PACKAGE_PATH}" > "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Applications/Harbor.app/Contents/MacOS/harbor-desktop" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Library/Application Support/GoForj/Harbor/daemon-launcher" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "libexec/com.goforj.harbor.helper" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "libexec/com.goforj.harbor.launchdrelay" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Library/PrivilegedHelperTools/com.goforj.harbor.helper" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay" "${RUNNER_TEMP}/payload-files.txt"
          package_directory="$(dirname "${HARBOR_PACKAGE_PATH}")"
          package_name="$(basename "${HARBOR_PACKAGE_PATH}")"
          (
            cd "${package_directory}"
            shasum -a 256 "${package_name}" > "${package_name}.sha256"
            shasum -a 256 -c "${package_name}.sha256"
          )

      - name: Require clean package-owned installation state
        run: |
          while IFS= read -r path; do
            if sudo -n test -e "$path" || sudo -n test -L "$path"; then
              printf 'preexisting Harbor package path: %s\n' "$path" >&2
              exit 1
            fi
          done <<'EOF'
          /Applications/Harbor.app
          /Library/Application Support/GoForj/Harbor
          /Library/PrivilegedHelperTools/com.goforj.harbor.helper
          /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          /usr/local/bin/harbor
          EOF
          if pkgutil --pkg-info com.goforj.harbor >/dev/null 2>&1; then
            echo "preexisting Harbor package receipt" >&2
            exit 1
          fi

      - name: Install the assembled package
        run: sudo -n installer -pkg "${HARBOR_PACKAGE_PATH}" -target /

      - name: Verify installed product boundary
        run: |
          release_root="/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}"
          pkgutil --pkg-info com.goforj.harbor
          app_identity="$(stat -f '%u:%g %Sp' /Applications/Harbor.app/Contents/MacOS/harbor-desktop)"
          current_target="$(readlink "/Library/Application Support/GoForj/Harbor/current")"
          cli_target="$(readlink /usr/local/bin/harbor)"
          helper_identity="$(stat -f '%u:%g %Sp' /Library/PrivilegedHelperTools/com.goforj.harbor.helper)"
          relay_identity="$(stat -f '%u:%g %Sp' /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay)"
          privileged_identity="$(stat -f '%u:%g %Sp' "/Library/Application Support/GoForj/Harbor/Privileged")"
          pending_identity="$(stat -f '%u:%g %Sp' "/Library/Application Support/GoForj/Harbor/Privileged/tickets/pending")"
          printf 'installed app identity: %s\n' "$app_identity"
          printf 'installed current target: %s\n' "$current_target"
          printf 'installed CLI target: %s\n' "$cli_target"
          printf 'installed helper identity: %s\n' "$helper_identity"
          printf 'installed relay identity: %s\n' "$relay_identity"
          printf 'installed privileged identity: %s\n' "$privileged_identity"
          printf 'installed pending identity: %s\n' "$pending_identity"
          test -x /Applications/Harbor.app/Contents/MacOS/harbor-desktop
          test "$current_target" = "releases/${HARBOR_RELEASE_SEQUENCE}"
          test "$cli_target" = "/Library/Application Support/GoForj/Harbor/current/bin/harbor"
          test "$helper_identity" = "0:0 -rwsr-xr-x"
          test "$relay_identity" = "0:0 -rwxr-xr-x"
          test "$privileged_identity" = "0:0 drwx--x--x"
          test "$pending_identity" = "$(id -u):$(id -g) drwx------"
          cmp \
            "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/installation.json" \
            "/Library/Application Support/GoForj/Harbor/installation.json"
          sudo -n "${release_root}/bin/harbor-installer" install --user-id "$(id -u)" --group-id "$(id -g)"

      - name: Remove native package staging tree
        run: |
          staging_root="/Library/PrivilegedHelperTools/.goforj-harbor-payload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "${HARBOR_PAYLOAD_ROOT}" = "$staging_root"
          test ! -L "$staging_root"
          test "$(stat -f '%u:%g %Sp' "$staging_root")" = "0:0 drwxr-xr-x"
          sudo -n rm -rf -- "$staging_root"
          sudo -n test ! -e "$staging_root"

      - name: Build external acceptance prerequisites
        run: |
          binary_directory="${RUNNER_TEMP}/harbor-packaged-acceptance-bin"
          install -d -m 0700 "$binary_directory"
          (
            cd .ci/goforj
            go build -trimpath -o "${binary_directory}/forj" ./cmd/forj
          )
          GOBIN="$binary_directory" go install github.com/goforj/wire/cmd/wire@v1.2.0
          printf 'HARBOR_PACKAGED_ACCEPTANCE_BINARY_DIRECTORY=%s\n' "$binary_directory" >> "$GITHUB_ENV"
          printf '%s\n' "$binary_directory" >> "$GITHUB_PATH"

      - name: Preflight current-user keychain
        run: |
          security list-keychains -d user
          security default-keychain -d user
          security find-certificate -a -p >/dev/null

      - name: Capture and allow packaged acceptance authorization
        run: |
          authorization_directory="/var/root/harbor-packaged-authorizationdb"
          authorization_rule="${authorization_directory}/original.plist"
          authorization_digest="${authorization_directory}/original.sha256"
          authorization_marker="${authorization_directory}/capture-complete"
          sudo -n test ! -e "$authorization_directory"
          sudo -n install -d -m 0700 -o root -g wheel "$authorization_directory"
          sudo -n /bin/sh -ceu '
            umask 077
            /usr/bin/security authorizationdb read system.privilege.admin > "$1"
            /usr/bin/plutil -lint "$1" >/dev/null
            /bin/test -s "$1"
            /usr/bin/shasum -a 256 "$1" > "$2"
            /usr/bin/touch "$3"
          ' harbor-authorization-capture "$authorization_rule" "$authorization_digest" "$authorization_marker"
          sudo -n security authorizationdb write system.privilege.admin allow

      - name: Seed foreign administrator trust baseline
        run: |
          fixture_directory="${RUNNER_TEMP}/harbor-packaged-foreign-trust"
          fixture_certificate="${fixture_directory}/foreign-root.pem"
          fixture_key="${fixture_directory}/foreign-root-key.pem"
          install -d -m 0700 "$fixture_directory"
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -nodes \
            -days 1 \
            -subj "/CN=Harbor Packaged Foreign Trust Baseline" \
            -keyout "$fixture_key" \
            -out "$fixture_certificate"
          chmod 0600 "$fixture_key"
          chmod 0644 "$fixture_certificate"
          printf 'HARBOR_PACKAGED_FOREIGN_CERTIFICATE=%s\n' "$fixture_certificate" >> "$GITHUB_ENV"
          sudo -n security add-trusted-cert \
            -d \
            -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$fixture_certificate"
          sudo -n security verify-cert -c "$fixture_certificate" -p ssl

      - name: Run Darwin Authorization Services preflight diagnostic
        env:
          HARBOR_DARWIN_AUTHORIZATION_PREFLIGHT: "1"
        run: |
          go test \
            -tags=phase1acceptance \
            -count=1 \
            -timeout=30s \
            -run '^TestDarwinAuthorizationPreflight$' \
            ./internal/helper/launcher

      - name: Run installed-package trusted HTTPS acceptance
        env:
          HARBOR_TRUSTED_HTTPS_ACCEPTANCE: "1"
          HARBOR_TRUSTED_HTTPS_FORJ_BINARY: ${{ runner.temp }}/harbor-packaged-acceptance-bin/forj
          HARBOR_TRUSTED_HTTPS_FORJ_VERSION: "0.22.0"
          HARBOR_PHASE1_CLI_BINARY: /usr/local/bin/harbor
          HARBOR_PHASE1_DAEMON_BINARY: /Library/Application Support/GoForj/Harbor/daemon-launcher
          HARBOR_PHASE1_EVIDENCE_DIRECTORY: ${{ github.workspace }}/harbor-packaged-macos-evidence
        run: |
          test "$(command -v forj)" = "${HARBOR_PACKAGED_ACCEPTANCE_BINARY_DIRECTORY}/forj"
          test "$(command -v wire)" = "${HARBOR_PACKAGED_ACCEPTANCE_BINARY_DIRECTORY}/wire"
          test "$(readlink /usr/local/bin/harbor)" = "/Library/Application Support/GoForj/Harbor/current/bin/harbor"
          go test \
            -tags=phase1acceptance \
            -count=1 \
            -timeout=25m \
            -run '^TestTrustedHTTPSIntermediateNativeLifecycle$' \
            ./internal/acceptance
          go run ./cmd/platformproof verify-trusted-https \
            --root "$HARBOR_PHASE1_EVIDENCE_DIRECTORY" \
            --platform darwin

      - name: Restore packaged acceptance authorization
        if: always()
        run: |
          authorization_directory="/var/root/harbor-packaged-authorizationdb"
          authorization_rule="${authorization_directory}/original.plist"
          authorization_digest="${authorization_directory}/original.sha256"
          authorization_marker="${authorization_directory}/capture-complete"
          authorization_restored="${authorization_directory}/restored.plist"
          authorization_normalized_original="${authorization_directory}/original.normalized.json"
          authorization_normalized_restored="${authorization_directory}/restored.normalized.json"
          if ! sudo -n test -e "$authorization_directory"; then
            exit 0
          fi
          if ! sudo -n test -f "$authorization_marker"; then
            sudo -n rm -f \
              "$authorization_rule" \
              "$authorization_digest" \
              "$authorization_restored" \
              "$authorization_normalized_original" \
              "$authorization_normalized_restored"
            sudo -n rmdir "$authorization_directory"
            exit 0
          fi
          sudo -n /bin/sh -ceu '
            normalize_authorization_policy() {
              /bin/cp "$1" "$2"
              for metadata in created modified; do
                if /usr/bin/plutil -type "$metadata" "$2" >/dev/null 2>&1; then
                  /usr/bin/plutil -remove "$metadata" "$2"
                fi
              done
              /usr/bin/plutil -convert json -r "$2"
            }
            /usr/bin/shasum -a 256 -c "$2"
            /usr/bin/security authorizationdb write system.privilege.admin < "$1"
            umask 077
            /usr/bin/security authorizationdb read system.privilege.admin > "$4"
            normalize_authorization_policy "$1" "$5"
            normalize_authorization_policy "$4" "$6"
            /usr/bin/cmp -s "$5" "$6"
            /bin/rm -f "$6" "$5" "$4" "$3" "$2" "$1"
            /bin/rmdir "$7"
          ' harbor-authorization-restore \
            "$authorization_rule" \
            "$authorization_digest" \
            "$authorization_marker" \
            "$authorization_restored" \
            "$authorization_normalized_original" \
            "$authorization_normalized_restored" \
            "$authorization_directory"

      - name: Exercise ownership-aware package uninstall
        run: |
          installed_helper="/Library/PrivilegedHelperTools/com.goforj.harbor.helper"
          immutable_helper="/Library/Application Support/GoForj/Harbor/current/libexec/com.goforj.harbor.helper"
          printf '%s\n' "foreign helper ${GITHUB_RUN_ID}" |
            sudo -n tee "$installed_helper" >/dev/null
          sudo -n chown root:wheel "$installed_helper"
          sudo -n chmod 4755 "$installed_helper"
          mismatch_log="${RUNNER_TEMP}/harbor-uninstall-mismatch.log"
          if sudo -n "/Library/Application Support/GoForj/Harbor/current/bin/harbor-installer" \
            uninstall \
            --user-id "$(id -u)" \
            --group-id "$(id -g)" >"$mismatch_log" 2>&1; then
            echo "uninstaller removed a mismatched fixed helper" >&2
            exit 1
          fi
          cat "$mismatch_log"
          grep -Fq \
            "admit installed Harbor helper: file size or mode differs from the sealed identity" \
            "$mismatch_log"
          test "$(sudo -n cat "$installed_helper")" = "foreign helper ${GITHUB_RUN_ID}"
          sudo -n install \
            -m 4755 \
            -o root \
            -g wheel \
            "$immutable_helper" \
            "$installed_helper"

          foreign_parent="/Library/Application Support/GoForj"
          foreign_sentinel="${foreign_parent}/foreign-package-sentinel-${GITHUB_RUN_ID}"
          sudo -n install -d -m 0755 -o root -g wheel "$foreign_parent"
          printf '%s\n' "foreign package state ${GITHUB_RUN_ID}" |
            sudo -n tee "$foreign_sentinel" >/dev/null
          sudo -n chown root:wheel "$foreign_sentinel"
          sudo -n chmod 0644 "$foreign_sentinel"

          sudo -n "/Library/Application Support/GoForj/Harbor/current/bin/harbor-installer" \
            uninstall \
            --user-id "$(id -u)" \
            --group-id "$(id -g)"

          while IFS= read -r path; do
            if sudo -n test -e "$path" || sudo -n test -L "$path"; then
              printf 'retained Harbor package path: %s\n' "$path" >&2
              exit 1
            fi
          done <<'EOF'
          /Applications/Harbor.app
          /Library/Application Support/GoForj/Harbor
          /Library/PrivilegedHelperTools/com.goforj.harbor.helper
          /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          /usr/local/bin/harbor
          /etc/resolver/test
          /Library/LaunchDaemons/com.goforj.harbor.launchdrelay.plist
          EOF
          if pkgutil --pkg-info com.goforj.harbor >/dev/null 2>&1; then
            echo "retained Harbor package receipt" >&2
            exit 1
          fi
          if sudo -n launchctl print system/com.goforj.harbor.launchdrelay >/dev/null 2>&1; then
            echo "retained Harbor launchd relay" >&2
            exit 1
          fi
          test "$(sudo -n cat "$foreign_sentinel")" = "foreign package state ${GITHUB_RUN_ID}"
          sudo -n security verify-cert -c "$HARBOR_PACKAGED_FOREIGN_CERTIFICATE" -p ssl

          evidence="${HARBOR_PHASE1_EVIDENCE_DIRECTORY}/package-uninstall.txt"
          {
            printf 'package_sha256=%s\n' "$(shasum -a 256 "$HARBOR_PACKAGE_PATH" | awk '{print $1}')"
            printf 'package_receipt=absent\n'
            printf 'installed_product_paths=absent\n'
            printf 'harbor_host_projection=absent\n'
            printf 'mismatched_fixed_helper=preserved\n'
            printf 'foreign_package_sentinel=preserved\n'
            printf 'foreign_administrator_trust=preserved\n'
          } > "$evidence"

          sudo -n rm -f "$foreign_sentinel"
          sudo -n rmdir "$foreign_parent"

      - name: Upload exact tested unsigned package
        uses: actions/upload-artifact@v7
        with:
          name: GoForj-Harbor-macos-arm64-tested-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/GoForj-Harbor-macos-arm64-*.pkg
            ${{ runner.temp }}/GoForj-Harbor-macos-arm64-*.pkg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged-product acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GoForj-Harbor-macos-arm64-packaged-evidence-${{ github.run_number }}
          path: |
            harbor-packaged-macos-evidence/summary.json
            harbor-packaged-macos-evidence/package-uninstall.txt
          if-no-files-found: error
          retention-days: 14
