name: macOS development package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part semantic base version for this unsigned development package
        required: true
        default: 0.1.0

permissions:
  contents: read

concurrency:
  group: macos-development-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Apple silicon PKG
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HARBOR_RELEASE_SEQUENCE: ${{ github.run_number }}
      HARBOR_RELEASE_VERSION: ${{ inputs.version }}-dev.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure package paths
        run: |
          payload_root="/Library/PrivilegedHelperTools/.goforj-harbor-payload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo -n test ! -e "$payload_root"
          sudo -n install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$payload_root"
          echo "HARBOR_PAYLOAD_ROOT=${payload_root}" >> "${GITHUB_ENV}"
          echo "HARBOR_PACKAGE_PATH=${RUNNER_TEMP}/GoForj-Harbor-macos-arm64-development.pkg" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Verify native package worker
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test -n "${GITHUB_SHA}"
          test "$(git status --porcelain)" = ""

      - name: Build production frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build release desktop
        working-directory: desktop
        run: |
          ldflags="-X github.com/goforj/harbor/internal/buildinfo.releaseVersion=${HARBOR_RELEASE_VERSION}"
          wails build -s -clean -platform darwin/arm64 -tags release -trimpath -ldflags "$ldflags" -o Harbor
          test -x build/bin/Harbor.app/Contents/MacOS/harbor-desktop
          test "$(lipo -archs build/bin/Harbor.app/Contents/MacOS/harbor-desktop)" = "arm64"

      - name: Stage fixed macOS payload
        run: |
          release_root="${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}"
          privileged_root="${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools"
          mkdir -p \
            "${HARBOR_PAYLOAD_ROOT}/Applications" \
            "${release_root}/bin" \
            "${release_root}/libexec" \
            "${privileged_root}" \
            "${HARBOR_PAYLOAD_ROOT}/usr/local/bin"
          cp -R desktop/build/bin/Harbor.app "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${HARBOR_RELEASE_VERSION}" "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${HARBOR_RELEASE_SEQUENCE}" "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 15.0" "${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"

          ldflags="-X github.com/goforj/harbor/internal/buildinfo.releaseVersion=${HARBOR_RELEASE_VERSION}"
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/harbor" ./cmd/app
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/harbord" ./cmd/harbord
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/outputbroker" ./cmd/outputbroker
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/bin/harbor-installer" ./cmd/installer
          go build -trimpath -ldflags "$ldflags" -o "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/daemon-launcher" ./cmd/daemonlauncher
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/libexec/com.goforj.harbor.helper" ./cmd/helper
          go build -trimpath -ldflags "$ldflags" -o "${release_root}/libexec/com.goforj.harbor.launchdrelay" ./cmd/launchdrelay
          cp "${release_root}/libexec/com.goforj.harbor.helper" "${privileged_root}/com.goforj.harbor.helper"
          cp "${release_root}/libexec/com.goforj.harbor.launchdrelay" "${privileged_root}/com.goforj.harbor.launchdrelay"
          sudo -n chmod -N \
            "${privileged_root}/com.goforj.harbor.helper" \
            "${privileged_root}/com.goforj.harbor.launchdrelay"
          sudo -n chown root:wheel \
            "${privileged_root}/com.goforj.harbor.helper" \
            "${privileged_root}/com.goforj.harbor.launchdrelay"
          sudo -n chmod 4755 "${privileged_root}/com.goforj.harbor.helper"
          sudo -n chmod 0755 "${privileged_root}/com.goforj.harbor.launchdrelay"

          ln -s "releases/${HARBOR_RELEASE_SEQUENCE}" "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/current"
          ln -s "/Library/Application Support/GoForj/Harbor/current/bin/harbor" "${HARBOR_PAYLOAD_ROOT}/usr/local/bin/harbor"

      - name: Seal development release manifest
        run: |
          go run ./cmd/releasebundle \
            --payload "${HARBOR_PAYLOAD_ROOT}" \
            --version "${HARBOR_RELEASE_VERSION}" \
            --sequence "${HARBOR_RELEASE_SEQUENCE}" \
            --revision "${GITHUB_SHA}"
          sudo -n chown -R root:wheel "${HARBOR_PAYLOAD_ROOT}"
          sudo -n chmod 0755 "${HARBOR_PAYLOAD_ROOT}"
          sudo -n chmod 4755 "${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.helper"

      - name: Validate staged payload
        run: |
          plist="${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.goforj.harbor"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${HARBOR_RELEASE_VERSION}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${HARBOR_RELEASE_SEQUENCE}"
          test "$(readlink "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/current")" = "releases/${HARBOR_RELEASE_SEQUENCE}"

          while IFS= read -r executable; do
            architecture="$(lipo -archs "$executable")"
            printf 'staged executable architecture: %s=%s\n' "$executable" "$architecture"
            test "$architecture" = "arm64"
          done <<EOF
          ${HARBOR_PAYLOAD_ROOT}/Applications/Harbor.app/Contents/MacOS/harbor-desktop
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/daemon-launcher
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/harbor
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/harbord
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/outputbroker
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/bin/harbor-installer
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/libexec/com.goforj.harbor.helper
          ${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}/libexec/com.goforj.harbor.launchdrelay
          ${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.helper
          ${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          EOF
          helper_identity="$(stat -f '%u:%g %Sp' "${HARBOR_PAYLOAD_ROOT}/Library/PrivilegedHelperTools/com.goforj.harbor.helper")"
          printf 'staged fixed helper identity: %s\n' "$helper_identity"
          test "$helper_identity" = "0:0 -rwsr-xr-x"

      - name: Assemble unsigned installer package
        run: |
          pkgbuild \
            --root "${HARBOR_PAYLOAD_ROOT}" \
            --scripts packaging/darwin/scripts \
            --identifier com.goforj.harbor \
            --version "${HARBOR_RELEASE_VERSION}" \
            --install-location / \
            "${HARBOR_PACKAGE_PATH}"

      - name: Inspect installer payload
        run: |
          pkgutil --payload-files "${HARBOR_PACKAGE_PATH}" > "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Applications/Harbor.app/Contents/MacOS/harbor-desktop" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Library/Application Support/GoForj/Harbor/daemon-launcher" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "libexec/com.goforj.harbor.helper" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "libexec/com.goforj.harbor.launchdrelay" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Library/PrivilegedHelperTools/com.goforj.harbor.helper" "${RUNNER_TEMP}/payload-files.txt"
          grep -Fq "Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay" "${RUNNER_TEMP}/payload-files.txt"
          package_directory="$(dirname "${HARBOR_PACKAGE_PATH}")"
          package_name="$(basename "${HARBOR_PACKAGE_PATH}")"
          (
            cd "${package_directory}"
            shasum -a 256 "${package_name}" > "${package_name}.sha256"
            shasum -a 256 -c "${package_name}.sha256"
          )

      - name: Require clean package-owned installation state
        run: |
          while IFS= read -r path; do
            if sudo -n test -e "$path" || sudo -n test -L "$path"; then
              printf 'preexisting Harbor package path: %s\n' "$path" >&2
              exit 1
            fi
          done <<'EOF'
          /Applications/Harbor.app
          /Library/Application Support/GoForj/Harbor
          /Library/PrivilegedHelperTools/com.goforj.harbor.helper
          /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay
          /usr/local/bin/harbor
          EOF
          if pkgutil --pkg-info com.goforj.harbor >/dev/null 2>&1; then
            echo "preexisting Harbor package receipt" >&2
            exit 1
          fi

      - name: Install the assembled package
        run: sudo -n installer -pkg "${HARBOR_PACKAGE_PATH}" -target /

      - name: Verify installed product boundary
        run: |
          release_root="/Library/Application Support/GoForj/Harbor/releases/${HARBOR_RELEASE_SEQUENCE}"
          pkgutil --pkg-info com.goforj.harbor
          app_identity="$(stat -f '%u:%g %Sp' /Applications/Harbor.app/Contents/MacOS/harbor-desktop)"
          current_target="$(readlink "/Library/Application Support/GoForj/Harbor/current")"
          cli_target="$(readlink /usr/local/bin/harbor)"
          helper_identity="$(stat -f '%u:%g %Sp' /Library/PrivilegedHelperTools/com.goforj.harbor.helper)"
          relay_identity="$(stat -f '%u:%g %Sp' /Library/PrivilegedHelperTools/com.goforj.harbor.launchdrelay)"
          privileged_identity="$(stat -f '%u:%g %Sp' "/Library/Application Support/GoForj/Harbor/Privileged")"
          pending_identity="$(stat -f '%u:%g %Sp' "/Library/Application Support/GoForj/Harbor/Privileged/tickets/pending")"
          printf 'installed app identity: %s\n' "$app_identity"
          printf 'installed current target: %s\n' "$current_target"
          printf 'installed CLI target: %s\n' "$cli_target"
          printf 'installed helper identity: %s\n' "$helper_identity"
          printf 'installed relay identity: %s\n' "$relay_identity"
          printf 'installed privileged identity: %s\n' "$privileged_identity"
          printf 'installed pending identity: %s\n' "$pending_identity"
          test -x /Applications/Harbor.app/Contents/MacOS/harbor-desktop
          test "$current_target" = "releases/${HARBOR_RELEASE_SEQUENCE}"
          test "$cli_target" = "/Library/Application Support/GoForj/Harbor/current/bin/harbor"
          test "$helper_identity" = "0:0 -rwsr-xr-x"
          test "$relay_identity" = "0:0 -rwxr-xr-x"
          test "$privileged_identity" = "0:0 drwx--x--x"
          test "$pending_identity" = "$(id -u):$(id -g) drwx------"
          cmp \
            "${HARBOR_PAYLOAD_ROOT}/Library/Application Support/GoForj/Harbor/installation.json" \
            "/Library/Application Support/GoForj/Harbor/installation.json"
          sudo -n "${release_root}/bin/harbor-installer" install --user-id "$(id -u)" --group-id "$(id -g)"

      - name: Upload unsigned development package
        uses: actions/upload-artifact@v7
        with:
          name: GoForj-Harbor-macos-arm64-development-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/GoForj-Harbor-macos-arm64-development.pkg
            ${{ runner.temp }}/GoForj-Harbor-macos-arm64-development.pkg.sha256
          if-no-files-found: error
          retention-days: 14
